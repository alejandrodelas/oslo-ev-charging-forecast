name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q tests
      - name: Rebuild the dataset and retrain from raw data
        run: |
          python src/build_dataset.py
          python src/train.py
          python src/replicate_team.py
          python src/analysis.py
